  <g fill="none" stroke="#000000" stroke-width="118" stroke-linecap="butt">
    <!-- ring -->
    <circle cx="512" cy="512" r="188"/>
    <!-- four diagonal spokes -->
    <line x1="625.1" y1="398.9" x2="773.6" y2="250.4"/>
